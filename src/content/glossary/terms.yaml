# Coffearium glossary. One item per term; the `id` becomes the anchor (#id) on /glossary/.
# `aliases` are other English words that should link here (plurals are matched automatically).
# `entry` points to the full article when one exists – links then go to the article instead.
# Translations stay marked unverified until a native-speaking coffee professional has checked them.
- id: acetic-acid-bacteria
  en: Acetic acid bacteria
  es: Bacterias acéticas
  zh-hant: 醋酸菌
  zh-hans: 醋酸菌
  definition: Bacteria that turn sugars and alcohol into acetic and other acids; common in dry processing.
  stage: process
- id: anaerobic-fermentation
  en: Anaerobic fermentation
  es: Fermentación anaeróbica
  zh-hant: 厭氧發酵
  zh-hans: 厌氧发酵
  definition: Fermenting coffee in sealed, low-oxygen vessels.
  stage: process
  entry: anaerobic-fermentation
- id: cascara
  en: Cascara
  aliases: [coffee husk, husk coffee, husk]
  es: Cáscara
  zh-hant: 咖啡果皮
  zh-hans: 咖啡果皮
  definition: The dried skin and pulp of the coffee cherry, removed after natural processing; also used for tea-like drinks.
  stage: process
- id: casehardening
  en: Casehardening
  es: Endurecimiento superficial
  zh-hant: 表面硬化
  zh-hans: 表面硬化
  definition: Drying defect in which the outside of the seed dries much faster than the inside and forms a hard shell.
  stage: process
- id: cupping
  en: Cupping
  es: Catación
  zh-hant: 杯測
  zh-hans: 杯测
  definition: Standardised tasting used to evaluate coffee.
  stage: cup
  entry: cupping
- id: demucilager
  en: Mechanical demucilager
  aliases: [demucilager, mechanical demucilaging, demucilaging]
  es: Desmucilaginador
  zh-hant: 機械脫膠機
  zh-hans: 机械脱胶机
  definition: Machine that removes mucilage by friction instead of fermentation, using little water.
  stage: process
  entry: mechanical-demucilaging
- id: endosperm
  en: Endosperm
  es: Endospermo
  zh-hant: 胚乳
  zh-hans: 胚乳
  definition: The storage tissue that makes up most of the coffee seed – the part that is roasted.
  stage: plant
- id: extraction
  en: Extraction
  es: Extracción
  zh-hant: 萃取
  zh-hans: 萃取
  definition: Dissolving soluble compounds from ground coffee into water.
  stage: brew
  entry: what-extraction-is
- id: fermentation
  en: Fermentation
  es: Fermentación
  zh-hant: 發酵
  zh-hans: 发酵
  definition: In processing, the breakdown of sugars and pectins around the seed by yeasts and bacteria.
  stage: process
  entry: fermentation
- id: green-coffee
  en: Green coffee
  aliases: [green coffee beans, green bean]
  es: Café verde
  zh-hant: 生豆
  zh-hans: 生豆
  definition: Unroasted coffee seeds that have been dried and milled.
  stage: trade
- id: honey-process
  en: Honey process
  es: Proceso honey
  zh-hant: 蜜處理
  zh-hans: 蜜处理
  definition: Drying depulped coffee with some mucilage left on.
  stage: process
  entry: honey-process
- id: hulling
  en: Hulling
  aliases: [dehulling, huller, dry milling]
  es: Trilla
  zh-hant: 脫殼
  zh-hans: 脱壳
  definition: Mechanically removing the dried husk or parchment to obtain green coffee.
  stage: process
  entry: hulling-and-dry-milling
- id: lactic-acid-bacteria
  en: Lactic acid bacteria
  es: Bacterias ácido lácticas
  zh-hant: 乳酸菌
  zh-hans: 乳酸菌
  definition: Bacteria that turn sugars mainly into lactic acid; they dominate most wet fermentations.
  stage: process
- id: moisture-content
  en: Moisture content
  es: Contenido de humedad
  zh-hant: 含水率
  zh-hans: 含水率
  definition: The share of water in coffee by weight, usually given on a wet basis (wb).
  stage: process
  entry: moisture-and-water-activity
- id: mucilage
  en: Mucilage
  es: Mucílago
  zh-hant: 果膠
  zh-hans: 果胶
  definition: The sticky layer between the fruit skin and the parchment.
  stage: process
  entry: mucilage
- id: natural-process
  en: Natural process
  es: Proceso natural
  zh-hant: 日曬處理
  zh-hans: 日晒处理
  definition: Drying the whole cherry before removing the fruit.
  stage: process
  entry: natural-process
- id: ochratoxin-a
  en: Ochratoxin A
  aliases: [OTA]
  es: Ocratoxina A
  zh-hant: 赭麴毒素A
  zh-hans: 赭曲霉毒素A
  definition: A mycotoxin produced by some moulds; its prevention is a key aim of good drying practice.
  stage: process
  entry: ochratoxin-a
- id: parchment
  en: Parchment
  aliases: [parchment coffee]
  es: Pergamino
  zh-hant: 帶殼豆
  zh-hans: 带壳豆
  definition: The papery layer around the seed; also coffee dried inside it.
  stage: process
  entry: coffee-cherry-anatomy
- id: patio
  en: Drying patio
  aliases: [patio]
  es: Patio de secado
  zh-hant: 曬場
  zh-hans: 晒场
  definition: A flat surface of concrete, brick or earth on which coffee is spread to dry in the sun.
  stage: process
- id: pectin
  en: Pectin
  aliases: [pectic substances]
  es: Pectina
  zh-hant: 果膠質
  zh-hans: 果胶质
  definition: Gel-forming polysaccharide of plant cell walls; a main component of coffee mucilage.
  stage: plant
- id: pulper
  en: Pulper
  aliases: [depulper, pulping machine, pulping, depulping]
  es: Despulpadora
  definition: Machine that squeezes the seeds out of the fresh cherry, removing skin and pulp.
  stage: process
  entry: pulping
- id: raised-bed
  en: Raised bed
  aliases: [African bed, drying bed]
  es: Cama africana
  zh-hant: 高架棚
  zh-hans: 高架棚
  definition: A mesh table on which coffee dries with air moving above and below it.
  stage: process
- id: roast-profile
  en: Roast profile
  es: Perfil de tueste
  zh-hant: 烘焙曲線
  zh-hans: 烘焙曲线
  definition: The time and temperature curve of a roast.
  stage: roast
  entry: roast-profile
- id: silverskin
  en: Silverskin
  aliases: [silver skin, chaff]
  es: Película plateada
  zh-hant: 銀皮
  zh-hans: 银皮
  definition: The thin film that covers the coffee seed under the parchment.
  stage: plant
  entry: coffee-cherry-anatomy
- id: water-activity
  en: Water activity
  es: Actividad de agua
  zh-hant: 水活性
  zh-hans: 水分活度
  definition: How much of the water in a food is available to microorganisms (aw, 0 to 1); key to storage safety.
  stage: process
  entry: moisture-and-water-activity
- id: washed-process
  en: Washed process
  aliases: [wet process, wet processing, washed coffee]
  es: Proceso lavado
  zh-hant: 水洗處理
  zh-hans: 水洗处理
  definition: Removing fruit and mucilage before drying.
  stage: process
  entry: washed-process
- id: pectinase
  en: Pectinase
  aliases: [pectinases, pectinolytic enzymes, pectolytic enzymes]
  es: Pectinasa
  zh-hant: 果膠酶
  zh-hans: 果胶酶
  definition: Any enzyme that breaks down pectin; used to speed up mucilage removal.
  stage: process
  translationsVerified: false
- id: pectin-methylesterase
  en: Pectin methylesterase
  es: Pectina metilesterasa
  zh-hant: 果膠甲酯酶
  zh-hans: 果胶甲酯酶
  definition: Enzyme that removes methyl ester groups from pectin, releasing methanol.
  stage: process
  translationsVerified: false
- id: polygalacturonase
  en: Polygalacturonase
  es: Poligalacturonasa
  zh-hant: 多聚半乳糖醛酸酶
  zh-hans: 多聚半乳糖醛酸酶
  definition: Enzyme that splits the pectin chain by hydrolysis.
  stage: process
  translationsVerified: false
- id: pectin-lyase
  en: Pectin lyase
  aliases: [pectate lyase]
  es: Pectina liasa
  zh-hant: 果膠裂解酶
  zh-hans: 果胶裂解酶
  definition: Enzyme that splits esterified pectin by β-elimination rather than hydrolysis.
  stage: process
  translationsVerified: false
- id: homogalacturonan
  en: Homogalacturonan
  es: Homogalacturonano
  zh-hant: 同型半乳糖醛酸聚糖
  zh-hans: 同型半乳糖醛酸聚糖
  definition: The main pectin chain, made of α-1,4-linked galacturonic acid units.
  stage: plant
  translationsVerified: false
- id: degree-of-methylesterification
  en: Degree of methylesterification
  aliases: [degree of methylation, high-methoxyl]
  es: Grado de metilesterificación
  zh-hant: 甲酯化度
  zh-hans: 甲酯化度
  definition: The share of galacturonic acid units in pectin that carry a methyl ester.
  stage: plant
  translationsVerified: false
- id: sorption-isotherm
  en: Sorption isotherm
  aliases: [moisture sorption isotherm, adsorption isotherm, desorption isotherm]
  es: Isoterma de sorción
  zh-hant: 吸附等溫線
  zh-hans: 吸附等温线
  definition: The curve linking a food's equilibrium moisture content to water activity at one temperature.
  stage: process
  entry: moisture-and-water-activity
  translationsVerified: false
- id: equilibrium-moisture-content
  en: Equilibrium moisture content
  es: Humedad de equilibrio
  zh-hant: 平衡含水率
  zh-hans: 平衡含水率
  definition: The moisture a product reaches when it stops gaining or losing water to air of a given temperature and humidity.
  stage: process
  translationsVerified: false
- id: equilibrium-relative-humidity
  en: Equilibrium relative humidity
  es: Humedad relativa de equilibrio
  zh-hant: 平衡相對濕度
  zh-hans: 平衡相对湿度
  definition: The relative humidity of air in equilibrium with a sample; numerically water activity × 100.
  stage: process
  translationsVerified: false
- id: sorption-hysteresis
  en: Sorption hysteresis
  es: Histéresis de sorción
  zh-hant: 吸附遲滯
  zh-hans: 吸附滞后
  definition: The difference between the drying (desorption) and rewetting (adsorption) isotherms of the same material.
  stage: process
  translationsVerified: false
- id: glass-transition
  en: Glass transition
  aliases: [glass transition temperature]
  es: Transición vítrea
  zh-hant: 玻璃轉化
  zh-hans: 玻璃化转变
  definition: The temperature range in which an amorphous solid changes from a rigid glassy state to a softer rubbery one; lowered by water.
  stage: process
  entry: glass-rubber-transition
  translationsVerified: false
- id: wet-basis
  en: Wet basis
  aliases: [dry basis]
  es: Base húmeda
  zh-hant: 濕基
  zh-hans: 湿基
  definition: Moisture expressed as water per total wet mass, the coffee-trade convention (dry basis uses dry matter as the reference).
  stage: process
  entry: moisture-and-water-activity
  translationsVerified: false
- id: starter-culture
  en: Starter culture
  aliases: [inoculum, inoculated fermentation]
  es: Cultivo iniciador
  zh-hant: 發酵菌種
  zh-hans: 发酵菌种
  definition: A selected strain of yeast or bacteria added to coffee to steer its fermentation.
  stage: process
  entry: co-fermentation
  translationsVerified: false
- id: amplicon-sequencing
  en: Amplicon sequencing
  aliases: [metabarcoding, 16S sequencing, ITS sequencing]
  es: Secuenciación de amplicones
  zh-hant: 擴增子定序
  zh-hans: 扩增子测序
  definition: A DNA method that identifies microbes by sequencing a marker gene such as 16S rRNA or ITS.
  stage: process
  translationsVerified: false
- id: heterofermentative
  en: Heterofermentative
  es: Heterofermentativo
  zh-hant: 異型發酵
  zh-hans: 异型发酵
  definition: Describes lactic acid bacteria that make lactic acid plus other products such as ethanol, acetic acid or mannitol.
  stage: process
  translationsVerified: false
- id: homofermentative
  en: Homofermentative
  es: Homofermentativo
  zh-hant: 同型發酵
  zh-hans: 同型发酵
  definition: Describes lactic acid bacteria that turn sugars mainly into lactic acid.
  stage: process
  translationsVerified: false
- id: pectinolytic
  en: Pectinolytic
  aliases: [pectinolysis]
  es: Pectinolítico
  zh-hant: 果膠分解
  zh-hans: 果胶分解
  definition: Able to break down pectin, the main structural material of coffee mucilage.
  stage: process
  translationsVerified: false
- id: enterobacteria
  en: Enterobacteria
  aliases: [Enterobacteriaceae]
  es: Enterobacterias
  zh-hant: 腸桿菌
  zh-hans: 肠杆菌
  definition: Bacteria of the family Enterobacteriaceae, such as Pantoea, Erwinia and Klebsiella, common early in coffee fermentation.
  stage: process
  translationsVerified: false
- id: stinker-bean
  en: Stinker bean
  aliases: [stinker]
  es: Grano hediondo
  zh-hant: 臭豆
  zh-hans: 臭豆
  definition: A green bean with a foul, fermented smell, linked to excessively long fermentation, unclean process water, nipped beans or dirty equipment.
  stage: process
  translationsVerified: false
- id: fermaestro
  en: Fermaestro
  es: Fermaestro
  zh-hant: 發酵終點測定器
  zh-hans: 发酵终点测定器
  definition: A Cenicafé device that shows the washing point by measuring how far a sample of fermenting coffee settles as broken-down mucilage drains away.
  stage: process
  translationsVerified: false
- id: brix
  en: Brix
  aliases: [degrees Brix]
  es: Brix
  zh-hant: 白利糖度
  zh-hans: 白利糖度
  definition: A measure of dissolved solids, mostly sugars, in a liquid, read with a refractometer.
  stage: process
  translationsVerified: false
- id: floaters
  en: Floaters
  aliases: [floater]
  es: Flotes
  zh-hant: 浮豆
  zh-hans: 浮豆
  definition: Cherries or beans that float in water – typically overripe, dried, undeveloped or damaged fruit – removed before processing.
  stage: farm
  translationsVerified: false
- id: selective-picking
  en: Selective picking
  aliases: [selective harvesting]
  es: Recolección selectiva
  zh-hant: 選擇性採收
  zh-hans: 选择性采收
  definition: Hand harvesting in which only ripe cherries are picked, over several rounds.
  stage: farm
  entry: harvesting-and-sorting
  translationsVerified: false
- id: strip-picking
  en: Strip picking
  aliases: [strip harvesting, derriça]
  es: Cosecha por ordeño
  zh-hant: 捋採
  zh-hans: 捋采
  definition: Harvesting all the fruit on a branch at once, by hand or machine, regardless of ripeness.
  stage: farm
  entry: harvesting-and-sorting
  translationsVerified: false
- id: breast-plate
  en: Breast plate
  aliases: [pechero]
  es: Pechero
  zh-hant: 胸板
  zh-hans: 胸板
  definition: The fixed, ribbed plate of a pulper against which the rotating drum or disc presses the cherry.
  stage: process
  translationsVerified: false
- id: repasser
  en: Repasser
  es: Repasadora
  zh-hant: 復脫機
  zh-hans: 复脱机
  definition: A second pulper that re-pulps cherries which passed through the first pulper whole.
  stage: process
  translationsVerified: false
- id: siphon-tank
  en: Siphon tank
  aliases: [cherry siphon]
  es: Sifón
  zh-hant: 虹吸槽
  zh-hans: 虹吸槽
  definition: A water tank between cherry reception and the pulper in which floating cherries are separated from sinking ones.
  stage: process
  translationsVerified: false
- id: nipped-bean
  en: Nipped bean
  aliases: [pulper-nipped bean]
  es: Grano mordido
  zh-hant: 脫皮機咬傷豆
  zh-hans: 脱皮机咬伤豆
  definition: A seed cut or crushed by a badly adjusted pulper; counted as a defect.
  stage: process
  translationsVerified: false
- id: dry-pulping
  en: Dry pulping
  aliases: [pulping without water]
  es: Despulpado sin agua
  zh-hant: 無水脫皮
  zh-hans: 无水脱皮
  definition: Pulping cherries without adding water, fed from a dry hopper.
  stage: process
  translationsVerified: false
- id: polishing
  en: Polishing
  aliases: [polisher]
  es: Pulido
  zh-hant: 拋光
  zh-hans: 抛光
  definition: Mechanical removal of the residual silverskin from green coffee after hulling.
  stage: process
  translationsVerified: false
- id: husk-coffee
  en: Husk coffee
  aliases: [dried cherry]
  es: Café en cereza seca
  zh-hant: 乾果咖啡
  zh-hans: 干果咖啡
  definition: Whole coffee cherry dried with its skin, pulp and parchment still on the seed, before hulling.
  stage: process
  translationsVerified: false
- id: outturn
  en: Outturn
  aliases: [hulling recovery, outturn ratio]
  es: Rendimiento
  zh-hant: 出品率
  zh-hans: 出品率
  definition: The weight of green coffee obtained from a given weight of dried parchment or dried cherry.
  stage: process
  translationsVerified: false
- id: semi-washed
  en: Semi-washed
  es: Semilavado
  zh-hant: 半水洗
  zh-hans: 半水洗
  definition: 'An ambiguous term used for three different processes: pulped coffee dried in its mucilage (Codex code of practice), pulped coffee whose mucilage is removed by a machine without fermentation (FAO), and, in the coffee trade, Indonesian wet-hulled coffee.'
  stage: process
  translationsVerified: false
- id: becolsub
  en: Becolsub
  es: Becolsub
  zh-hant: Becolsub 生態處理模組
  zh-hans: Becolsub 生态处理模组
  definition: Cenicafé's ecological wet-mill module combining water-free pulping, an upflow demucilager and a screw conveyor that mixes mucilage into the pulp.
  stage: process
  translationsVerified: false
- id: reposado
  en: Reposado (defect)
  aliases: [reposado]
  es: Reposado
  zh-hant: 陳化味（瑕疵）
  zh-hans: 陈化味（瑕疵）
  definition: A storage defect with aged, heavy, low-acid flavours and whitish, faded green beans, linked to warm, humid or overlong storage.
  stage: process
  translationsVerified: false
- id: tetrazolium-test
  en: Tetrazolium test
  es: Prueba de tetrazolio
  zh-hant: 四唑鹽活性測試
  zh-hans: 四唑盐活性测试
  definition: A staining test that shows whether seed tissue is still alive.
  stage: process
  translationsVerified: false
- id: electrical-conductivity-test
  en: Electrical conductivity test
  es: Prueba de conductividad eléctrica
  zh-hant: 電導度測試
  zh-hans: 电导率测试
  definition: A measure of the ions that leak from soaked beans into water, used as an indicator of cell-membrane damage.
  stage: process
  translationsVerified: false
- id: screen-size
  en: Screen size
  aliases: [screen number, sieve size]
  es: Tamaño de criba
  zh-hant: 篩網目數
  zh-hans: 筛网目数
  definition: Size grade of green coffee, given as the hole size of the screen that retains the bean, in 64ths of an inch.
  stage: process
  entry: grading-and-sorting
  translationsVerified: false
- id: peaberry
  en: Peaberry
  aliases: [peaberries]
  es: Caracol
  zh-hant: 圓豆
  zh-hans: 圆豆
  definition: A single rounded seed formed in place of the usual two flat seeds.
  stage: plant
  entry: peaberries-and-bean-shapes
  translationsVerified: false
- id: full-defect
  en: Full defect
  aliases: [full defect equivalent]
  es: Defecto completo
  zh-hant: 完整瑕疵當量
  zh-hans: 完整瑕疵当量
  definition: The unit of a green-coffee defect count; each defect type converts to full defects by a fixed equivalence.
  stage: process
  translationsVerified: false
- id: primary-defect
  en: Primary defect
  aliases: [category 1 defect]
  es: Defecto primario
  zh-hant: 一級瑕疵
  zh-hans: 一级瑕疵
  definition: In SCAA grading, a severe defect such as a full black, full sour or pod that counts heavily and bars specialty grade.
  stage: process
  translationsVerified: false
- id: quaker
  en: Quaker
  es: Quaker
  zh-hant: 未熟豆（Quaker）
  zh-hans: 未熟豆（Quaker）
  definition: A bean that stays pale when roasted.
  stage: process
  translationsVerified: false
- id: cereja-descascada
  en: Cereja descascada
  aliases: [cereja descascado, CD coffee]
  es: Cereza descascarada
  zh-hant: 去皮日曬
  zh-hans: 去皮日晒
  definition: Brazilian name for coffee whose skin is removed and which is dried with the mucilage still attached to the parchment.
  stage: process
  entry: pulped-natural
  translationsVerified: false
- id: mucilage-retention
  en: Mucilage retention
  aliases: [mucilage retained]
  es: Retención de mucílago
  zh-hant: 果膠保留率
  zh-hans: 果胶保留率
  definition: The share of the original mucilage left on the parchment before drying, used to describe honey grades.
  stage: process
  translationsVerified: false
- id: despolpado
  en: Despolpado
  aliases: [café despolpado]
  es: Despulpado
  zh-hant: 去果肉發酵水洗（巴西）
  zh-hans: 去果肉发酵水洗（巴西）
  definition: Brazilian term for coffee that is pulped, fermented and washed before drying – washed coffee.
  stage: process
  translationsVerified: false
- id: aqueous-extract
  en: Aqueous extract
  aliases: [water-soluble extract]
  es: Extracto acuoso
  zh-hant: 水溶性萃取物
  zh-hans: 水溶性萃取物
  definition: The share of a coffee sample's mass that dissolves in hot water, used as a composition and quality measure.
  stage: process
  translationsVerified: false
- id: wet-huller
  en: Wet huller
  es: Descascadora en húmedo
  zh-hant: 濕式脫殼機
  zh-hans: 湿式脱壳机
  definition: A huller adapted to remove parchment from coffee at high moisture, for example by replacing the steel huller bar with a rubber strip.
  stage: process
  translationsVerified: false
- id: development-time
  en: Development time
  es: Tiempo de desarrollo
  zh-hant: 發展時間
  zh-hans: 发展时间
  definition: The time from first crack to the end of the roast.
  stage: roast
  entry: development-time
  aliases: [development phase]
  translationsVerified: false
- id: second-crack
  en: Second crack
  es: Segundo crack
  zh-hant: 二爆
  zh-hans: 二爆
  definition: A second, snapping crack heard when a roast is taken very dark.
  stage: roast
  entry: second-crack
  translationsVerified: false
- id: air-to-bean-ratio
  en: Air-to-bean ratio
  es: Relación aire-grano
  zh-hant: 風豆比
  zh-hans: 风豆比
  definition: Kilograms of hot process air used per kilogram of green coffee in a roast.
  stage: roast
